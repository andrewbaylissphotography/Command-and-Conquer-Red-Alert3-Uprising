<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Commanders Challenge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: lightgray;
            color: black;
        }

        header {
            background: #000;
            color: white;
            text-align: center;
            padding: 32px 16px;
        }

        header img {
            max-width: 100%;
            height: auto;
        }

        #maps {
            max-width: 100%;
            margin: 0 auto;
            padding: 16px;
        }

        .map {
            background: white;
            margin-bottom: 32px;
            padding: 16px;
            border-radius: 6px;

            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
            align-items: start;
        }

        .map img {
            width: 100%;
            border-radius: 4px;
        }

        .map h2 {
            margin-top: 0;
        }

        .meta {
            font-style: italic;
            color: #444;
            margin-bottom: 16px;
        }

        .description h3 {
            margin-top: 0;
        }

        .toggle-script {
            margin: 16px 0 8px;
            padding: 8px 12px;
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }

        .toggle-script:hover {
            background: #444;
        }

        .script {
            background: #111;
            color: #0f0;
            padding: 12px;
            overflow-x: auto;
            white-space: pre;
            border-radius: 4px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 900px) {
            .map {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <script>
        const container = document.getElementById("maps");

        maps.forEach(map => {
            const el = document.createElement("div");
            el.className = "map";

            el.innerHTML = `
        <img src="${map.image}" alt="${map.title}">

        <div>
            <h2>${map.title}</h2>
            <div class="meta">${map.meta}</div>

            <div class="description">
                ${map.summary}
            </div>

            <button class="toggle-script">Show WorldBuilder Script</button>
            <pre class="script hidden">${map.script}</pre>
        </div>
    `;

            container.appendChild(el);
        });
    </script>

    <script>
        document.addEventListener("click", e => {
            if (!e.target.classList.contains("toggle-script")) return;

            const script = e.target.nextElementSibling;
            const hidden = script.classList.toggle("hidden");

            e.target.textContent = hidden
                ? "Show WorldBuilder Script"
                : "Hide WorldBuilder Script";
        });
    </script>
